name: Docker Publish (Production Images)

# Until the first release, `main` *is* production: every push publishes the
# unprefixed tags, including `latest`. At 1.0, swap the `push` trigger back for
# `release: [released]` and restore the `get-latest-release` job (see this
# file's git history) so builds come from the latest published release tag
# rather than the tip of `main`.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # docs/ is a standalone Nuxt site and is excluded from the image via
      # .dockerignore, so it can never change the build.
      - 'docs/**'
  # Weekly rebuild so the published images pick up new base images even when
  # nothing has landed on main.
  schedule:
    - cron: '0 9 * * 2'

# Two pushes in quick succession would otherwise race for the `latest` tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # The scheduled rebuild picks up new base images, so the suite runs on every
  # publish rather than trusting the result from whenever the commit landed.
  tests:
    uses: ./.github/workflows/service_run-tests.yml
    with:
      ref: ${{ github.sha }}

  build-production-images:
    needs: tests
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "docker.io/serversideup/benchkit-laravel,ghcr.io/serversideup/benchkit-laravel"
      tag-prefix: ''
      release-type: latest
      ref: ${{ github.sha }}
    secrets: inherit
