name: Docker Publish (Production Images)

on:
  workflow_dispatch:
  release:
    types: [released]
  schedule:
    - cron: '0 9 * * 2'

permissions:
  contents: read
  packages: write

jobs:
  get-latest-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.get_latest_release.outputs.release_tag }}
    steps:
      - name: Get Latest Release
        id: get_latest_release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "🛑 No published release found. Refusing to build :latest."
            exit 1
          fi
          echo "release_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

  # The weekly rebuild picks up new base images, so re-run the suite against the
  # released tag rather than trusting the result from whenever it was cut.
  tests:
    needs: get-latest-release
    uses: ./.github/workflows/service_run-tests.yml
    with:
      ref: ${{ needs.get-latest-release.outputs.release_tag }}

  build-production-images:
    needs: [get-latest-release, tests]
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "docker.io/serversideup/benchkit-laravel,ghcr.io/serversideup/benchkit-laravel"
      tag-prefix: ''
      release-type: latest
      ref: ${{ needs.get-latest-release.outputs.release_tag }}
    secrets: inherit
