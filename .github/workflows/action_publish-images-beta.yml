name: Docker Publish (Beta Images)

# `beta` currently tracks the tip of `main` so changes can be pulled and tested
# before a release. Once 1.0 ships, swap the `push` trigger for
# `release: [prereleased]` and resolve `ref` from the latest pre-release tag.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # docs/ is a standalone Nuxt site and is excluded from the image via
      # .dockerignore, so it can never change the build.
      - 'docs/**'

# Two pushes in quick succession would otherwise race for the `beta` tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/service_run-tests.yml
    with:
      ref: ${{ github.sha }}

  build-beta-images:
    needs: tests
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "docker.io/serversideup/benchkit-laravel,ghcr.io/serversideup/benchkit-laravel"
      tag-prefix: "beta"
      release-type: testing
      ref: ${{ github.sha }}
    secrets: inherit
