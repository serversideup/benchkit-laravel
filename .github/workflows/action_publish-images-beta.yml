name: Docker Publish (Beta Images)

# Dormant until the first release. `main` currently publishes the production
# tags directly (see action_publish-images-production.yml), so there is nothing
# for `beta` to track and this runs on demand only. Once production moves back
# to `release: [released]`, restore the trigger below so `beta` tracks
# pre-releases, and resolve `ref` from the latest pre-release tag:
#
#   release:
#     types: [prereleased]
#
on:
  workflow_dispatch:

# Two runs in quick succession would otherwise race for the `beta` tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/service_run-tests.yml
    with:
      ref: ${{ github.sha }}

  build-beta-images:
    needs: tests
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "docker.io/serversideup/benchkit-laravel,ghcr.io/serversideup/benchkit-laravel"
      tag-prefix: "beta"
      release-type: testing
      ref: ${{ github.sha }}
    secrets: inherit
